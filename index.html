    <script>
        // --- IndexedDB 本機儲存系統 ---
        const DB = {
            db: null,
            async init() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open('CangYiGeDB', 1);
                    req.onupgradeneeded = e => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('settings')) {
                            db.createObjectStore('settings', { keyPath: 'key' });
                        }
                    };
                    req.onsuccess = e => { this.db = e.target.result; resolve(); };
                    req.onerror = e => reject(e);
                });
            },
            async set(key, value) {
                if (!this.db) await this.init();
                return new Promise(resolve => {
                    const tx = this.db.transaction('settings', 'readwrite');
                    tx.objectStore('settings').put({ key: key, value: value });
                    tx.oncomplete = () => resolve();
                });
            },
            async get(key) {
                if (!this.db) await this.init();
                return new Promise(resolve => {
                    const tx = this.db.transaction('settings', 'readonly');
                    const req = tx.objectStore('settings').get(key);
                    req.onsuccess = () => resolve(req.result ? req.result.value : null);
                });
            }
        };

        const luoshuIndices = [
            { id: 'se', name: '巽' }, { id: 's', name: '離' }, { id: 'sw', name: '坤' },
            { id: 'e', name: '震' }, { id: 'c', name: '中' }, { id: 'w', name: '兌' },
            { id: 'ne', name: '艮' }, { id: 'n', name: '坎' }, { id: 'nw', name: '乾' }
        ];

        const flyPath = [4, 8, 5, 6, 1, 7, 2, 3, 0]; 
        
        function flyStars(centerStar, isForward = true) {
            let stars = new Array(9);
            let currentStar = centerStar;
            for (let i = 0; i < 9; i++) {
                stars[flyPath[i]] = currentStar;
                currentStar = isForward ? (currentStar === 9 ? 1 : currentStar + 1) : (currentStar === 1 ? 9 : currentStar - 1);
            }
            return stars;
        }

        function getYearStar(year) {
            let sum = 0, tempYear = year;
            while (tempYear > 0) { sum += tempYear % 10; tempYear = Math.floor(tempYear / 10); }
            while (sum > 9) {
                let tempSum = 0;
                while (sum > 0) { tempSum += sum % 10; sum = Math.floor(sum / 10); }
                sum = tempSum;
            }
            let star = 11 - sum;
            // 已修正：移除錯誤的 2000 年後減一邏輯。標準流年公式「11 - 數字和 (算至個位數)」通用於所有西元年。
            while (star <= 0) star += 9;
            while (star > 9) star -= 9;
            return star;
        }

        function getPeriod(year) {
            if (year >= 1984 && year <= 2003) return 7;
            if (year >= 2004 && year <= 2023) return 8;
            if (year >= 2024 && year <= 2043) return 9;
            return Math.ceil((year - 1863) / 20) % 9 || 9;
        }

        /* 
        小六壬陣列設定：
        gridIndex 對應 3x2 網格的位置，還原古法掐指一算手勢 (馬蹄形 U 字)：
        0: 左上 (食指上), 1: 中上 (中指上), 2: 右上 (無名指上)
        3: 左下 (食指下 - 大安起點), 4: 中下 (中指下), 5: 右下 (無名指下)
        */
        const liurenData = {
            1: { name: '大安', type: '大吉', color: '#4ade80', tailwind: 'text-green-400', desc: '大安事事昌，求財在坤方。\n失物去不遠，宅舍保安康。', poem: '行人身未動，病者主無妨。將軍回田野，仔細更推詳。', gridIndex: 3 },
            2: { name: '留連', type: '平凶', color: '#94a3b8', tailwind: 'text-slate-400', desc: '留連事難成，求謀日未明。\n官事只宜緩，去者未回程。', poem: '失物南方見，急討方稱心。更須防口舌，人口且平平。', gridIndex: 0 },
            3: { name: '速喜', type: '中吉', color: '#f87171', tailwind: 'text-red-400', desc: '速喜喜來臨，求財向南行。\n失物申未午，逢人路上尋。', poem: '官事有福德，病者無禍侵。田宅六畜吉，行人有信音。', gridIndex: 1 },
            4: { name: '赤口', type: '大凶', color: '#fb923c', tailwind: 'text-orange-400', desc: '赤口主口舌，官非切忌防。\n失物急去尋，行人有驚慌。', poem: '雞犬多作怪，病者出西方。更須防咒詛，誠恐染瘟殃。', gridIndex: 2 },
            5: { name: '小吉', type: '小吉', color: '#facc15', tailwind: 'text-yellow-400', desc: '小吉最吉昌，路上好商量。\n陰人來報喜，失物在坤方。', poem: '行人即便至，交關甚是強。凡事皆和合，病者叩穹蒼。', gridIndex: 5 },
            6: { name: '空亡', type: '大凶', color: '#c084fc', tailwind: 'text-purple-400', desc: '空亡事不長，陰人小乖張。\n求財無利益，行人有災殃。', poem: '失物尋一見，官事有刑傷。病人逢暗鬼，解禳保安康。', gridIndex: 4 }
        };

        function initLiurenGrid() {
            const grid = document.getElementById('liuren-grid');
            let htmlArray = new Array(6);
            Object.keys(liurenData).forEach(key => {
                const data = liurenData[key];
                htmlArray[data.gridIndex] = `
                    <div class="liuren-cell text-gray-500" id="liuren-cell-${key}" style="color: ${data.color}">
                        <div class="text-2xl font-bold tracking-widest">${data.name}</div>
                        <div class="text-xs mt-1 opacity-70">${data.type}</div>
                    </div>`;
            });
            grid.innerHTML = htmlArray.join('');
        }

        function renderLiuren(lunarMonth, lunarDay, timeZhiStr) {
            const zhiList = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
            const timeIndex = zhiList.indexOf(timeZhiStr) + 1;
            
            // 小六壬運算公式：(月 + 日 + 時 - 2) % 6
            let resultNumber = (lunarMonth + lunarDay + timeIndex - 2) % 6;
            if (resultNumber === 0) resultNumber = 6;

            document.getElementById('liuren-formula').innerText = `農曆 ${lunarMonth}月 ➔ ${lunarDay}日 ➔ ${timeZhiStr}時`;

            for (let i = 1; i <= 6; i++) {
                const cell = document.getElementById(`liuren-cell-${i}`);
                if (cell) {
                    cell.classList.remove('active');
                    cell.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                }
            }

            const activeData = liurenData[resultNumber];
            const activeCell = document.getElementById(`liuren-cell-${resultNumber}`);
            if (activeCell) {
                activeCell.classList.add('active');
                activeCell.style.color = activeData.color;
                activeCell.style.borderColor = activeData.color;
            }

            const titleEl = document.getElementById('liuren-result-title');
            titleEl.innerText = activeData.name;
            titleEl.className = `text-4xl font-bold tracking-widest ${activeData.tailwind}`;
            
            const typeEl = document.getElementById('liuren-result-type');
            typeEl.innerText = activeData.type;
            typeEl.className = `text-lg font-bold px-3 py-1 rounded-md bg-gray-800 border border-gray-600 ${activeData.tailwind}`;
            
            document.getElementById('liuren-result-desc').innerText = activeData.desc;
            document.getElementById('liuren-result-poem').innerText = activeData.poem;
            document.getElementById('liuren-card-line').style.color = activeData.color;
        }

        function generateGridHTML(stars) {
            let html = '';
            luoshuIndices.forEach((palace, index) => {
                const s = stars[index];
                html += `<div class="grid-cell"><div class="star-base color-${s}">${s}</div><div class="palace-name">${palace.name}</div></div>`;
            });
            return html;
        }

        let currentTargetDate = new Date();

        function renderAllGrids() {
            if (typeof Solar === 'undefined' || typeof Lunar === 'undefined') return;

            try {
                const solar = Solar.fromDate(currentTargetDate);
                const lunar = solar.getLunar();
                
                // 獲取干支，並拆分為單字 (天干、地支)
                const yearGanZhi = lunar.getYearInGanZhiExact();
                const monthGanZhi = lunar.getMonthInGanZhiExact();
                const dayGanZhi = lunar.getDayInGanZhiExact();
                const timeGanZhi = lunar.getTimeInGanZhi();

                document.getElementById('bz-year-gan').innerText = yearGanZhi[0] || '-';
                document.getElementById('bz-year-zhi').innerText = yearGanZhi[1] || '-';
                document.getElementById('bz-month-gan').innerText = monthGanZhi[0] || '-';
                document.getElementById('bz-month-zhi').innerText = monthGanZhi[1] || '-';
                document.getElementById('bz-day-gan').innerText = dayGanZhi[0] || '-';
                document.getElementById('bz-day-zhi').innerText = dayGanZhi[1] || '-';
                document.getElementById('bz-time-gan').innerText = timeGanZhi[0] || '-';
                document.getElementById('bz-time-zhi').innerText = timeGanZhi[1] || '-';

                const solarYear = currentTargetDate.getFullYear();
                const solarMonth = currentTargetDate.getMonth() + 1;
                const solarDay = currentTargetDate.getDate();

                // 九運盤
                const period = getPeriod(solarYear);
                document.getElementById('period-grid').innerHTML = generateGridHTML(flyStars(period, true));
                document.getElementById('title-period').innerText = `【${period}運盤】`;

                // 流年盤
                const yearCenter = getYearStar(solarYear);
                document.getElementById('year-grid').innerHTML = generateGridHTML(flyStars(yearCenter, true));

                // 取得真實流月飛星 (嚴格基於農曆節氣與干支月)
                let monthCenter;
                if (typeof lunar.getMonthNineStar === 'function') {
                    // 直接調用曆法庫的專業九星計算
                    monthCenter = lunar.getMonthNineStar().getNumber();
                } else {
                    // 備用手動算法
                    const zhiList = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
                    const yearZhiIndex = zhiList.indexOf(yearGanZhi[1]);
                    const monthZhiIndex = zhiList.indexOf(monthGanZhi[1]); 
                    let startStar = 8;
                    if ([0, 6, 3, 9].includes(yearZhiIndex)) startStar = 8;
                    else if ([4, 10, 1, 7].includes(yearZhiIndex)) startStar = 5;
                    else startStar = 2;
                    // 寅月(index 2)為正月，計算月份偏移
                    let monthOffset = (monthZhiIndex - 2 + 12) % 12;
                    monthCenter = startStar - monthOffset;
                    while (monthCenter <= 0) monthCenter += 9;
                }
                document.getElementById('month-grid').innerHTML = generateGridHTML(flyStars(monthCenter, true));

                // 取得真實流日飛星 (自動判斷冬至/夏至陰陽遁)
                let dayCenter;
                if (typeof lunar.getDayNineStar === 'function') {
                    // 直接調用曆法庫的專業日家紫白星計算
                    dayCenter = lunar.getDayNineStar().getNumber();
                } else {
                    dayCenter = 1; // 極端環境下的兜底
                }
                // 玄空飛星排盤通常年月日時皆採「順飛」(洛書軌跡+1)
                document.getElementById('day-grid').innerHTML = generateGridHTML(flyStars(dayCenter, true));

                // 更新小六壬
                renderLiuren(Math.abs(lunar.getMonth()), lunar.getDay(), lunar.getTimeZhi());
            } catch (e) {
                console.error("排盤計算錯誤:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            initLiurenGrid();
            
            // 強制隱藏設定面板，避免異常彈出
            const modal = document.getElementById('settings-modal');
            modal.style.display = 'none';
            modal.classList.add('hidden', 'opacity-0');
            
            // 初始化資料庫並讀取歷史紀錄
            await DB.init();
            const savedTime = await DB.get('targetTime');
            if (savedTime) currentTargetDate = new Date(savedTime);
            
            const datetimeInput = document.getElementById('custom-datetime');
            function formatForInput(date) {
                const tzoffset = (new Date()).getTimezoneOffset() * 60000;
                return (new Date(date - tzoffset)).toISOString().slice(0, 16);
            }
            datetimeInput.value = formatForInput(currentTargetDate);

            const tabStars = document.getElementById('tab-stars');
            const tabLiuren = document.getElementById('tab-liuren');
            const viewStars = document.getElementById('view-stars');
            const viewLiuren = document.getElementById('view-liuren');

            async function switchTab(tab, save = true) {
                if (save) await DB.set('activeTab', tab);
                if (tab === 'stars') {
                    tabStars.className = "px-6 py-2 rounded-full text-sm font-bold transition-all duration-300 bg-cyan-900/60 text-cyan-200 shadow-[0_0_10px_rgba(6,182,212,0.4)]";
                    tabLiuren.className = "px-6 py-2 rounded-full text-sm font-bold transition-all duration-300 text-gray-400 hover:text-gray-200";
                    viewLiuren.classList.add('opacity-0');
                    setTimeout(() => {
                        viewLiuren.classList.add('hidden');
                        viewStars.classList.remove('hidden');
                        setTimeout(() => viewStars.classList.remove('opacity-0'), 50);
                    }, 300);
                } else {
                    tabLiuren.className = "px-6 py-2 rounded-full text-sm font-bold transition-all duration-300 bg-purple-900/60 text-purple-200 shadow-[0_0_10px_rgba(168,85,247,0.4)]";
                    tabStars.className = "px-6 py-2 rounded-full text-sm font-bold transition-all duration-300 text-gray-400 hover:text-gray-200";
                    viewStars.classList.add('opacity-0');
                    setTimeout(() => {
                        viewStars.classList.add('hidden');
                        viewLiuren.classList.remove('hidden');
                        setTimeout(() => viewLiuren.classList.remove('opacity-0'), 50);
                    }, 300);
                }
            }

            const savedTab = await DB.get('activeTab') || 'stars';
            switchTab(savedTab, false);

            tabStars.addEventListener('click', () => switchTab('stars'));
            tabLiuren.addEventListener('click', () => switchTab('liuren'));

            // UI 設定面板綁定
            const toggleModal = (show) => {
                if (show) {
                    modal.style.display = 'flex';
                    modal.classList.remove('hidden'); modal.classList.add('flex');
                    setTimeout(() => { modal.classList.remove('opacity-0'); document.getElementById('settings-content').classList.remove('scale-95'); }, 10);
                } else {
                    modal.classList.add('opacity-0'); document.getElementById('settings-content').classList.add('scale-95');
                    setTimeout(() => { 
                        modal.classList.add('hidden'); modal.classList.remove('flex'); 
                        modal.style.display = 'none';
                    }, 300);
                }
            }
            document.getElementById('open-settings-btn').addEventListener('click', () => toggleModal(true));
            document.getElementById('close-icon-btn').addEventListener('click', () => toggleModal(false));
            
            document.getElementById('apply-settings-btn').addEventListener('click', async () => {
                if(datetimeInput.value) {
                    currentTargetDate = new Date(datetimeInput.value);
                    await DB.set('targetTime', currentTargetDate.getTime());
                    renderAllGrids();
                }
                toggleModal(false);
            });

            document.getElementById('reset-now-btn').addEventListener('click', async () => {
                currentTargetDate = new Date();
                await DB.set('targetTime', currentTargetDate.getTime());
                datetimeInput.value = formatForInput(currentTargetDate);
                renderAllGrids();
                toggleModal(false);
            });

            document.getElementById('btn-divine-now').addEventListener('click', async () => {
                currentTargetDate = new Date();
                await DB.set('targetTime', currentTargetDate.getTime());
                datetimeInput.value = formatForInput(currentTargetDate);
                renderAllGrids();
            });

            // 啟動排盤 (等待 Lunar 庫載入)
            let retryCount = 0;
            function checkAndRender() {
                if (typeof Lunar !== 'undefined') renderAllGrids();
                else if (retryCount < 10) { retryCount++; setTimeout(checkAndRender, 200); }
            }
            setTimeout(checkAndRender, 200);
        });
    </script>
</body>
